# 博客站点：主站（/） + 管理后台（/admin/） + API 反代（/api、/docs）
# HTTP(80) 与 HTTPS(443) 共用同一份站点配置；证书在 /etc/nginx/certs（宿主机 CERT_DIR）
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- 管理后台（blog-admin 构建产物，base=/admin/）----
    # 无斜杠 301 到 /admin/；^~ 确保 /admin/*.js 等静态资源不被下方主站缓存规则截获
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /usr/share/nginx/web/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(docs|openapi\.json)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ---- 博客主站（blog-index 构建产物）----
    location / {
        root /usr/share/nginx/web/index;
        try_files $uri $uri/ /index.html;
    }

    # 主站静态资源长缓存（Vite 文件名带 hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        root /usr/share/nginx/web/index;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
