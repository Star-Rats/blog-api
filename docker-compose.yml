name: blog

# 容器日志统一滚动：50MB × 4 个文件 = 上限 200MB
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "4"

services:
  # 网关：托管两个前端构建产物 + 反代 API
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default_logging
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # 前端构建产物挂载（在 .env 中按部署布局调整路径）
      - ${WEB_INDEX_DIST:-../blog-index/dist}:/usr/share/nginx/web/index:ro
      - ${WEB_ADMIN_DIST:-../blog-admin/dist}:/usr/share/nginx/web/admin:ro
      - ${DATA_DIR:-./data}/logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy

  # 博客后端
  api:
    build: .
    restart: unless-stopped
    logging: *default_logging
    environment:
      APP_ENV: prod
      PORT: "8000"
      WORKERS: ${WORKERS:-2}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-blog}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SITE_TITLE: ${SITE_TITLE:-My Blog}
      LOG_DIR: /app/logs
    volumes:
      - ${DATA_DIR:-./data}/logs/api:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MySQL：数据目录挂载到宿主机 DATA_DIR/mysql
  mysql:
    image: mysql:8.0.30
    restart: unless-stopped
    logging: *default_logging
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-blog}
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
